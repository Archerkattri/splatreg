name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (hosted CPU fallback)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hosted runner has no CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e . pytest pytest-xdist scipy
      - name: Run test suite (CPU fallback)
        # Optional-backend tests (gsplat/pypose/theseus/gtsam) and the CUDA-only
        # camera-localization tests skip honestly when those deps are absent.
        # Keep the suite serial: several tests assert real CPU wall-clock budgets,
        # and xdist workers contend with PyTorch's own thread pool.
        # The two `performance` tests retain their >=2x / >=1.5x gates for a
        # controlled host, but shared-runner wall time is not a stable CI signal.
        run: pytest tests/ -q -m "not performance"
